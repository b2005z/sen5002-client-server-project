<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — Cardiff Met Navigator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: radial-gradient(ellipse at 40% 60%, #3a1a15, #1a0f0d);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 320px;
    background: #f9cdc8;
    border-radius: 28px;
    padding: 32px 28px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: up .4s ease;
  }
  @keyframes up { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
  .badge {
    position: absolute; top: 16px; right: 18px;
    background: #fff; border: 1.5px solid #d4a017;
    border-radius: 5px; padding: 5px 14px;
    font-size: 12px; font-weight: 600; color: #c0392b;
  }
  .logo-wrap { width: 90px; height: 90px; margin-top: 18px; }
  .logo-wrap svg { width: 100%; height: 100%; }
  .app-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px; color: #c0392b;
    text-align: center; line-height: 1.35; margin-top: 12px;
  }
  .gold-rule { width: 60px; height: 2px; background: #f0c060; border-radius: 1px; margin: 8px auto 0; }
  .form { width: 100%; margin-top: 18px; display: flex; flex-direction: column; }
  .input-field {
    width: 100%; padding: 11px 14px; margin-top: 10px;
    border: 1.5px solid #c0392b; border-radius: 5px;
    background: #fff; font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: #2c1a17; outline: none;
  }
  .input-field:focus { border-color: #922b21; }
  .input-field::placeholder { color: #b07a74; }
  .err { font-size: 11px; color: #922b21; margin-top: 5px; display: none; }
  .btn-row { display: flex; justify-content: center; margin-top: 14px; }
  .btn-submit {
    padding: 11px 44px; background: #f0c060;
    border: 1.5px solid #d4a017; border-radius: 5px;
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    font-weight: 600; color: #2c1a17; cursor: pointer; transition: all .18s;
  }
  .btn-submit:hover { background: #d4a017; color: #fff; }
  .btn-link {
    margin-top: 10px; padding: 8px 16px;
    background: #f0c060; border: 1.5px solid #d4a017;
    border-radius: 5px; font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 500; color: #2c1a17;
    cursor: pointer; transition: all .18s; align-self: flex-start;
  }
  .btn-link:hover { background: #d4a017; color: #fff; }
  .back-row { width: 100%; display: flex; justify-content: center; margin-top: 16px; }
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.5); z-index: 100;
    align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .mbox {
    background: #fff; border-radius: 14px;
    padding: 26px 30px; max-width: 360px; width: 90%;
    box-shadow: 0 16px 48px rgba(0,0,0,.3);
  }
  .mbox h2 { font-family: 'Playfair Display', serif; font-size: 18px; color: #c0392b; margin-bottom: 10px; }
  .mbox p { font-size: 13px; color: #7a5a55; line-height: 1.65; }
  .mclose {
    margin-top: 16px; padding: 8px 24px;
    background: #f0c060; border: 1.5px solid #d4a017;
    border-radius: 5px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  .mclose:hover { background: #d4a017; color: #fff; }
</style>
</head>
<body>

<div class="card">
  <div class="badge">Staff</div>

  <div class="logo-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110">
      <path d="M55,8 C35,8 19,24 19,44 C19,68 55,102 55,102 C55,102 91,68 91,44 C91,24 75,8 55,8 Z" fill="#c0392b"/>
      <circle cx="55" cy="43" r="24" fill="#fff"/>
      <polygon points="55,22 58.5,36 51.5,36" fill="#c0392b"/>
      <polygon points="55,64 58.5,50 51.5,50" fill="#c0392b" opacity=".35"/>
      <polygon points="76,43 62,39.5 62,46.5" fill="#f0c060"/>
      <polygon points="34,43 48,39.5 48,46.5" fill="#f0c060" opacity=".6"/>
      <circle cx="55" cy="43" r="18" fill="none" stroke="#c0392b" stroke-width=".7" stroke-dasharray="2 5" opacity=".5"/>
      <circle cx="55" cy="43" r="5.5" fill="#c0392b"/>
      <circle cx="55" cy="43" r="2.5" fill="#fff"/>
      <ellipse cx="55" cy="105" rx="14" ry="4" fill="#2c1a17" opacity=".12"/>
    </svg>
  </div>

  <div class="app-title">Cardiff Metropolitan University<br>Navigation App</div>
  <div class="gold-rule"></div>

  <div class="form">
    <input class="input-field" type="email" id="email" placeholder="Staff Email" autocomplete="email">
    <input class="input-field" type="password" id="pass" placeholder="••••••••••" autocomplete="current-password">
    <span class="err" id="err">Please enter your email and password.</span>
    <div class="btn-row">
      <button class="btn-submit" onclick="doLogin()">Submit</button>
    </div>
    <button class="btn-link" onclick="document.getElementById('fmod').classList.add('open')">Forgot Password</button>
  </div>

  <div class="back-row">
    <button class="btn-link" onclick="window.location.href='welcome.html'">&#8592; Back</button>
  </div>
</div>

<div class="overlay" id="fmod" onclick="if(event.target.id==='fmod')document.getElementById('fmod').classList.remove('open')">
  <div class="mbox">
    <h2>Forgot Password</h2>
    <p>Contact IT Services to reset your Cardiff Met staff password.<br><br>
    <strong>Email:</strong> itservices@cardiffmet.ac.uk<br>
    <strong>Phone:</strong> +44 (0)29 2041 7000<br><br>
    Or visit the IT Help Desk in Block A, Ground Floor.</p>
    <button class="mclose" onclick="document.getElementById('fmod').classList.remove('open')">Close</button>
  </div>
</div>

<script>
  function doLogin() {
    var email = document.getElementById('email').value.trim();
    var pass  = document.getElementById('pass').value.trim();
    var err   = document.getElementById('err');
    if (!email || !pass) {
      err.textContent = 'Please enter your email and password.';
      err.style.display = 'block';
      return;
    }
    if (!email.includes('@')) {
      err.textContent = 'Please enter a valid email address.';
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    sessionStorage.setItem('userMode', 'Staff');
    window.location.href = 'building.html';
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
