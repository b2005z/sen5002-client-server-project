<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Map — Cardiff Met Navigator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 50% 30%,#3a1a15,#1a0f0d);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:860px;background:#f9cdc8;border-radius:14px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.45);animation:up .4s ease}
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

  /* ── HEADER ── */
  .hdr{background:#f9cdc8;border-bottom:1.5px solid #f0a89f;padding:12px 18px;display:flex;align-items:center;gap:14px}
  .logo{width:68px;height:68px;flex-shrink:0}.logo svg{width:100%;height:100%}
  .hdr-title{font-family:'Playfair Display',serif;font-size:17px;color:#c0392b;flex:1}
  .hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .mode-box{background:#fff;border:1.5px solid #d4a017;border-radius:5px;padding:5px 16px;font-size:13px;font-weight:600;color:#c0392b;min-width:110px;text-align:center}
  .hdr-btns{display:flex;gap:8px}
  .btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border-radius:5px;transition:all .18s}
  .btn-g{background:#f0c060;border:1.5px solid #d4a017;color:#2c1a17;padding:8px 18px}
  .btn-g:hover{background:#d4a017;color:#fff}
  .btn-so{background:#f0c060;border:1.5px solid #d4a017;color:#2c1a17;padding:7px 16px}
  .btn-so:hover{background:#c0392b;color:#fff}

  /* ── TOOLBAR ── */
  .toolbar{padding:10px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0a89f}
  .blk-label{background:#fff;border:1.5px solid #c0392b;border-radius:5px;padding:7px 22px;font-size:14px;font-weight:600;color:#c0392b;min-width:150px}
  .arr-group{display:flex}
  .arr{width:44px;height:40px;background:#7a8fa0;border:none;color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s}
  .arr:hover{background:#4e6878}
  .arr:first-child{border-radius:6px 0 0 6px}
  .arr:last-child{border-radius:0 6px 6px 0}

  /* ── MAP ── */
  .map-area{padding:18px 24px;display:flex;justify-content:center}
  .map-frame{width:560px;background:#fff;border:1.5px solid #aaa;border-radius:6px;overflow:hidden}
  .ftabs{display:flex;border-bottom:1px solid #e8d8d5;background:#fde8e5}
  .ftab{flex:1;padding:7px 4px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:#7a5a55;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
  .ftab.active{color:#c0392b;border-bottom-color:#c0392b;background:#fff}
  .ftab:hover:not(.active){color:#c0392b}
  .map-svg{display:block;width:100%;transition:opacity .3s}
  .map-svg.fading{opacity:0}
  .tip-strip{text-align:center;font-size:11px;color:#7a5a55;padding:5px 10px;background:#fff8f6;border-top:1px solid #f0e0dc;min-height:24px}

  /* ── LEGEND ── */
  .legend{display:flex;gap:10px;flex-wrap:wrap;padding:0 24px 8px}
  .leg{display:flex;align-items:center;gap:4px;font-size:10px;color:#7a5a55}
  .leg-sq{width:9px;height:9px;border-radius:2px}

  /* ── INFO STRIP ── */
  .info{margin:0 24px 14px;background:#fff;border:1.5px solid #f0a89f;border-radius:6px;padding:12px 16px;display:flex;gap:18px;align-items:flex-start}
  .info-main{flex:1}
  .info-name{font-family:'Playfair Display',serif;font-size:15px;color:#c0392b;margin-bottom:5px}
  .info-desc{font-size:12px;color:#7a5a55;line-height:1.6}
  .info-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .tag{background:#fde8e5;border:1px solid #f0a89f;border-radius:20px;padding:2px 9px;font-size:10px;color:#922b21;font-weight:500}
  .info-hrs{font-size:11px;color:#7a5a55;white-space:nowrap}
  .info-hrs strong{color:#c0392b;display:block;font-size:11px;margin-bottom:2px}

  /* ── FOOTER ── */
  .footer{border-top:1.5px solid #f0a89f;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}
  .help-btn{font-size:13px;font-weight:600;color:#c0392b;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:'DM Sans',sans-serif}
  .help-btn:hover{color:#922b21}

  /* ── MODAL (About/Help etc.) ── */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
  .overlay.open{display:flex}
  .mbox{background:#fff;border-radius:14px;padding:28px 32px;max-width:400px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.3)}
  .mbox h2{font-family:'Playfair Display',serif;font-size:19px;color:#c0392b;margin-bottom:10px}
  .mbox p{font-size:13px;color:#7a5a55;line-height:1.65}
  .mclose{margin-top:18px;padding:8px 24px;background:#f0c060;border:1.5px solid #d4a017;border-radius:5px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
  .mclose:hover{background:#d4a017;color:#fff}

  /* ── TOAST ── */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);background:#2c1a17;color:#fff;padding:9px 22px;border-radius:22px;font-size:13px;font-weight:500;transition:transform .3s;pointer-events:none;z-index:200}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* ════════════════════════════════════════
     PHOTO LIGHTBOX
  ════════════════════════════════════════ */
  .lightbox{
    display:none;position:fixed;inset:0;z-index:500;
    background:rgba(0,0,0,.92);
    flex-direction:column;align-items:center;justify-content:center;
    animation:lbIn .25s ease;
  }
  .lightbox.open{display:flex}
  @keyframes lbIn{from{opacity:0}to{opacity:1}}

  /* Close X */
  .lb-close{
    position:absolute;top:20px;right:24px;
    width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);
    color:#fff;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .18s;z-index:10;
  }
  .lb-close:hover{background:rgba(192,57,43,.8);border-color:#c0392b}

  /* Header info */
  .lb-header{
    position:absolute;top:22px;left:24px;right:80px;
    display:flex;flex-direction:column;gap:2px;
  }
  .lb-room-name{font-family:'Playfair Display',serif;font-size:18px;color:#fff;font-weight:700}
  .lb-room-sub{font-size:12px;color:rgba(255,255,255,.6)}

  /* Main image area */
  .lb-img-wrap{
    position:relative;width:100%;max-width:820px;
    display:flex;align-items:center;justify-content:center;
    padding:80px 80px 60px;
  }
  .lb-img{
    width:100%;max-height:60vh;object-fit:contain;
    border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.6);
    transition:opacity .25s,transform .25s;
  }
  .lb-img.sliding-out{opacity:0;transform:translateX(-30px)}
  .lb-img.sliding-in{animation:slideIn .25s ease forwards}
  @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

  /* Arrow buttons */
  .lb-arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);
    color:#fff;font-size:22px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .18s;
  }
  .lb-arrow:hover{background:rgba(240,192,96,.8);border-color:#f0c060;color:#2c1a17}
  .lb-arrow.lb-prev{left:20px}
  .lb-arrow.lb-next{right:20px}

  /* Dots / counter */
  .lb-counter{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;
  }
  .lb-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .2s,transform .2s;cursor:pointer}
  .lb-dot.active{background:#f0c060;transform:scale(1.3)}

  /* Caption */
  .lb-caption{
    position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
    font-size:12px;color:rgba(255,255,255,.5);white-space:nowrap;
  }

  /* Placeholder photo SVG style */
  .lb-photo-placeholder{
    width:100%;height:340px;
    border-radius:10px;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
  }

  /* Keyboard hint */
  .lb-keys{position:absolute;bottom:16px;right:24px;font-size:10px;color:rgba(255,255,255,.3)}
</style>
</head>
<body>

<div class="card">

  <!-- HEADER -->
  <div class="hdr">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110">
        <path d="M55,8 C35,8 19,24 19,44 C19,68 55,102 55,102 C55,102 91,68 91,44 C91,24 75,8 55,8 Z" fill="#c0392b"/>
        <circle cx="55" cy="43" r="24" fill="#fff"/>
        <polygon points="55,22 58.5,36 51.5,36" fill="#c0392b"/>
        <polygon points="55,64 58.5,50 51.5,50" fill="#c0392b" opacity=".35"/>
        <polygon points="76,43 62,39.5 62,46.5" fill="#f0c060"/>
        <polygon points="34,43 48,39.5 48,46.5" fill="#f0c060" opacity=".6"/>
        <circle cx="55" cy="43" r="18" fill="none" stroke="#c0392b" stroke-width=".7" stroke-dasharray="2 5" opacity=".5"/>
        <circle cx="55" cy="43" r="5.5" fill="#c0392b"/>
        <circle cx="55" cy="43" r="2.5" fill="#fff"/>
        <ellipse cx="55" cy="105" rx="14" ry="4" fill="#2c1a17" opacity=".12"/>
      </svg>
    </div>
    <div class="hdr-title">Cardiff Metropolitan University Navigation App</div>
    <div class="hdr-right">
      <div class="mode-box" id="mode-display">Student</div>
      <div class="hdr-btns">
        <button class="btn btn-g" onclick="openModal('about')">About Us</button>
        <button class="btn btn-g" onclick="openModal('contact')">Contact Us</button>
      </div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="blk-label" id="blk-label">Block A</div>
    <div class="arr-group">
      <button class="arr" onclick="prevBlk()">&#9650;</button>
      <button class="arr" onclick="nextBlk()">&#9660;</button>
    </div>
  </div>

  <!-- MAP -->
  <div class="map-area">
    <div class="map-frame">
      <div class="ftabs" id="ftabs"></div>
      <svg id="map-svg" class="map-svg" viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="tip-strip" id="tip">Click a room to view photos · Hover to see details</div>
    </div>
  </div>

  <!-- LEGEND -->
  <div class="legend">
    <div class="leg"><div class="leg-sq" style="background:#fde8e5;border:1px solid #f0a89f"></div>Lecture/Seminar</div>
    <div class="leg"><div class="leg-sq" style="background:#e8f0fc;border:1px solid #b5d4f4"></div>Lab/Studio</div>
    <div class="leg"><div class="leg-sq" style="background:#e8f5e8;border:1px solid #9FE1CB"></div>Social/Cafe</div>
    <div class="leg"><div class="leg-sq" style="background:#fff8e8;border:1px solid #fac775"></div>Reception</div>
    <div class="leg"><div class="leg-sq" style="background:#f0f0f0;border:1px solid #ccc"></div>Facilities</div>
    <div class="leg"><svg width="9" height="9" style="flex-shrink:0"><circle cx="4.5" cy="4.5" r="4" fill="#1D9E75"/></svg>Open</div>
    <div class="leg"><svg width="9" height="9" style="flex-shrink:0"><circle cx="4.5" cy="4.5" r="4" fill="#EF9F27"/></svg>Busy</div>
    <div class="leg"><svg width="9" height="9" style="flex-shrink:0"><circle cx="4.5" cy="4.5" r="4" fill="#E24B4A"/></svg>Closed</div>
    <div class="leg" style="margin-left:auto;color:#c0392b;font-weight:600;cursor:default">📷 Click room for photos</div>
  </div>

  <!-- INFO STRIP -->
  <div class="info">
    <div class="info-main">
      <div class="info-name" id="i-name"></div>
      <div class="info-desc" id="i-desc"></div>
      <div class="info-tags" id="i-tags"></div>
    </div>
    <div class="info-hrs">
      <strong>Opening Hours</strong>
      <span id="i-hrs"></span>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <button class="help-btn" onclick="openModal('help')">Help</button>
    <button class="btn btn-so" onclick="window.location.href='signout.html'">Sign Out</button>
  </div>

</div>

<!-- MODAL (About / Contact / Help) -->
<div class="overlay" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="mbox">
    <h2 id="m-title"></h2>
    <p  id="m-body"></p>
    <button class="mclose" onclick="closeModal()">Close</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ════════════════════════════════════════
     PHOTO LIGHTBOX
════════════════════════════════════════ -->
<div class="lightbox" id="lightbox">

  <!-- Close button -->
  <button class="lb-close" onclick="closeLightbox()" title="Close (Esc)">&#x2715;</button>

  <!-- Room info -->
  <div class="lb-header">
    <div class="lb-room-name" id="lb-room-name">Room Name</div>
    <div class="lb-room-sub"  id="lb-room-sub">Block — Floor</div>
  </div>

  <!-- Image + arrows -->
  <div class="lb-img-wrap">
    <!-- Left arrow -->
    <button class="lb-arrow lb-prev" onclick="lbNav(-1)" title="Previous photo (←)">&#8249;</button>

    <!-- Photo display (SVG placeholder) -->
    <div id="lb-photo-area" style="width:100%;display:flex;align-items:center;justify-content:center"></div>

    <!-- Right arrow -->
    <button class="lb-arrow lb-next" onclick="lbNav(1)" title="Next photo (→)">&#8250;</button>
  </div>

  <!-- Dot navigation -->
  <div class="lb-counter" id="lb-dots"></div>

  <!-- Caption -->
  <div class="lb-caption" id="lb-caption">Photo 1 of 3</div>

  <!-- Keyboard hint -->
  <div class="lb-keys">← → navigate &nbsp;|&nbsp; Esc close</div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════
   PHOTO DATA  —  dummy SVG placeholders for every room type.
   When you take real phone photos, replace the entries in
   ROOM_PHOTOS[roomId] with arrays of image paths like:
   ['../images/rooms/CG1-1.jpg', '../images/rooms/CG1-2.jpg']
══════════════════════════════════════════════════════════════ */

/* Colour palette per room type — used to generate unique placeholder images */
var TYPE_COLORS = {
  lecture:  ['#fde8e5','#c0392b','Lecture Room'],
  lab:      ['#e8f0fc','#185FA5','Lab / Studio'],
  social:   ['#e8f5e8','#0F6E56','Social Space'],
  reception:['#fff8e8','#8B6914','Reception'],
  facility: ['#f0f0f0','#555555','Facilities']
};

/* Global room-type lookup — populated when buildings data is parsed */
var ROOM_TYPE_MAP = {};  /* roomId -> type */
var ROOM_NAME_MAP = {};  /* roomId -> name */

/* Generate a placeholder SVG "photo" for a room */
function makePlaceholderSVG(roomId, photoIdx, totalPhotos, roomName, roomType) {
  var tc = TYPE_COLORS[roomType] || ['#f0f0f0','#555','Space'];
  var bg = tc[0], accent = tc[1], label = tc[2];
  var icons = {
    lecture:  '🎓', lab:'🔬', social:'☕', reception:'🏛️', facility:'🚪'
  };
  var icon = icons[roomType] || '📍';

  /* Each photo index gets a slightly different shade to look different */
  var shades = ['ff','ee','dd','cc','bb'];
  var shade  = shades[photoIdx % shades.length];

  return `<svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" style="border-radius:10px;display:block">
    <defs>
      <linearGradient id="g${photoIdx}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${bg}"/>
        <stop offset="100%" stop-color="${bg}${shade}"/>
      </linearGradient>
      <pattern id="p${photoIdx}" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="none"/>
        <circle cx="20" cy="20" r="1.5" fill="${accent}" opacity="0.15"/>
      </pattern>
    </defs>
    <!-- Background -->
    <rect width="760" height="340" fill="url(#g${photoIdx})"/>
    <rect width="760" height="340" fill="url(#p${photoIdx})"/>
    <!-- Decorative corner lines -->
    <line x1="0" y1="0" x2="120" y2="0"   stroke="${accent}" stroke-width="3" opacity="0.3"/>
    <line x1="0" y1="0" x2="0"   y2="80"  stroke="${accent}" stroke-width="3" opacity="0.3"/>
    <line x1="760" y1="340" x2="640" y2="340" stroke="${accent}" stroke-width="3" opacity="0.3"/>
    <line x1="760" y1="340" x2="760" y2="260" stroke="${accent}" stroke-width="3" opacity="0.3"/>
    <!-- Centre camera icon -->
    <rect x="320" y="100" width="120" height="90" rx="12" fill="${accent}" opacity="0.15"/>
    <rect x="340" y="118" width="80"  height="54" rx="8"  fill="${accent}" opacity="0.25"/>
    <circle cx="380" cy="148" r="20" fill="${accent}" opacity="0.35"/>
    <circle cx="380" cy="148" r="12" fill="${accent}" opacity="0.5"/>
    <!-- Camera lens highlight -->
    <circle cx="374" cy="142" r="3" fill="white" opacity="0.6"/>
    <!-- "Photo N of M" badge -->
    <rect x="310" y="216" width="140" height="26" rx="13" fill="${accent}" opacity="0.2"/>
    <text x="380" y="233" font-family="DM Sans,sans-serif" font-size="12" fill="${accent}" text-anchor="middle" font-weight="600">Photo ${photoIdx+1} of ${totalPhotos}</text>
    <!-- Room name -->
    <text x="380" y="290" font-family="Playfair Display,serif" font-size="18" fill="${accent}" text-anchor="middle" font-weight="700">${roomName}</text>
    <text x="380" y="310" font-family="DM Sans,sans-serif" font-size="12" fill="${accent}" text-anchor="middle" opacity="0.7">${label} · Cardiff Metropolitan University</text>
    <!-- Placeholder watermark -->
    <text x="380" y="70" font-family="DM Sans,sans-serif" font-size="11" fill="${accent}" text-anchor="middle" opacity="0.5">📷 Placeholder — replace with real photo</text>
  </svg>`;
}

/* How many placeholder photos per room type */
var PHOTOS_PER_TYPE = { lecture:3, lab:4, social:3, reception:2, facility:2 };

/* State */
var lbRoomId   = null;
var lbPhotoIdx = 0;
var lbPhotos   = [];   /* array of {type:'placeholder'|'image', src, name, type} */

/* ══════════════════════════════════════════════════════════════
   LIGHTBOX FUNCTIONS
══════════════════════════════════════════════════════════════ */
function openLightbox(roomId) {
  var roomName = ROOM_NAME_MAP[roomId] || roomId;
  var roomType = ROOM_TYPE_MAP[roomId] || 'facility';
  var b        = BUILDINGS[curIdx];
  var floor    = b.floors[curFloor];
  var sub      = b.label + ' — ' + floor.label;

  lbRoomId   = roomId;
  lbPhotoIdx = 0;

  /* Use real room photos where available, otherwise fall back to placeholders. */
  lbPhotos = [];
  if (REAL_PHOTOS[roomId] && REAL_PHOTOS[roomId].length) {
    REAL_PHOTOS[roomId].forEach(function(src) {
      lbPhotos.push({ kind:'image', src:src, roomName:roomName, roomType:roomType });
    });
  } else {
    var n = PHOTOS_PER_TYPE[roomType] || 2;
    for (var i = 0; i < n; i++) {
      lbPhotos.push({ kind:'placeholder', roomName:roomName, roomType:roomType, idx:i, total:n });
    }
  }

  /* Header */
  document.getElementById('lb-room-name').textContent = roomName;
  document.getElementById('lb-room-sub').textContent  = sub;

  /* Render */
  renderLbPhoto(0, false);

  /* Build dots */
  buildLbDots();

  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function lbNav(dir) {
  var n   = lbPhotos.length;
  var idx = (lbPhotoIdx + dir + n) % n;
  renderLbPhoto(idx, true);
}

function renderLbPhoto(idx, animate) {
  lbPhotoIdx = idx;
  var photo  = lbPhotos[idx];
  var area   = document.getElementById('lb-photo-area');

  if (animate) {
    area.style.opacity   = '0';
    area.style.transform = 'translateX(20px)';
    area.style.transition = 'opacity .2s,transform .2s';
    setTimeout(function() {
      injectPhoto(photo, area);
      area.style.opacity   = '1';
      area.style.transform = 'translateX(0)';
    }, 200);
  } else {
    area.style.opacity    = '1';
    area.style.transform  = 'translateX(0)';
    area.style.transition = '';
    injectPhoto(photo, area);
  }

  /* Caption */
  document.getElementById('lb-caption').textContent = 'Photo ' + (idx+1) + ' of ' + lbPhotos.length;

  /* Dots */
  var dots = document.querySelectorAll('.lb-dot');
  dots.forEach(function(d, i) { d.classList.toggle('active', i === idx); });
}

function injectPhoto(photo, area) {
  if (photo.kind === 'placeholder') {
    area.innerHTML = makePlaceholderSVG(lbRoomId, photo.idx, photo.total, photo.roomName, photo.roomType);
  } else {
    /* Real image */
    var img = document.createElement('img');
    img.src   = photo.src;

  }
}

/* ── DRAW FLOOR PLAN ── */
function drawFloor(bldg, fi) {
  var floor = bldg.floors[fi];
  var rooms = floor.rooms;
  var svg   = document.getElementById('map-svg');
  var VW = 560, VH = 220;
  var rawW = 0, rawH = 0;
  for (var i = 0; i < rooms.length; i++) {
    rawW = Math.max(rawW, rooms[i].x + rooms[i].w);
    rawH = Math.max(rawH, rooms[i].y + rooms[i].h);
  }
  rawW += 14; rawH += 14;
  var scX = (VW - 6) / rawW;
  var scY = (VH - 6) / rawH;
  var sc  = Math.min(scX, scY);
  var oX  = (VW - rawW * sc) / 2;
  var oY  = (VH - rawH * sc) / 2;
  var accent = bldg.id==='E'?'#185FA5':bldg.id==='F'?'#534AB7':bldg.id==='H'?'#0F6E56':'#c0392b';

  var html = '<rect width="' + VW + '" height="' + VH + '" fill="#f8f4f2"/>';
  html += '<rect x="0" y="0" width="' + VW + '" height="18" fill="' + accent + '22"/>';
  html += '<text x="' + (VW/2) + '" y="12" font-family="Playfair Display,serif" font-size="8.5" font-weight="700" fill="' + accent + '" text-anchor="middle">' + bldg.name + ' — ' + floor.label + '</text>';

  var minRX = 9999, minRY = 9999;
  for (var i = 0; i < rooms.length; i++) { minRX = Math.min(minRX, rooms[i].x); minRY = Math.min(minRY, rooms[i].y); }
  var bx = (oX + minRX * sc).toFixed(1);
  var by = (oY + minRY * sc).toFixed(1);
  var bw = ((rawW - 14) * sc).toFixed(1);
  var bh = ((rawH - 14) * sc).toFixed(1);
  html += '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" fill="none" stroke="' + accent + '" stroke-width="1.2" rx="3"/>';

  for (var i = 0; i < rooms.length; i++) {
    var r  = rooms[i];
    var rx = (oX + r.x * sc).toFixed(1);
    var ry = (oY + r.y * sc).toFixed(1);
    var rw = (r.w * sc).toFixed(1);
    var rh = (r.h * sc).toFixed(1);
    var cx = (oX + (r.x + r.w / 2) * sc).toFixed(1);
    var cy = (oY + (r.y + r.h / 2) * sc).toFixed(1);
    var fill = TYPE_FILL[r.type] || '#f5f5f5';
    var dc   = STATUS_COLOR[r.status];
    var dr   = Math.max(3, Math.min(5, r.w * sc * 0.065));
    var dx   = (oX + (r.x + r.w) * sc - dr - 2).toFixed(1);
    var dy   = (oY + r.y * sc + dr + 2).toFixed(1);
    var fs   = Math.max(6.5, Math.min(9.5, r.w * sc * 0.13));
    var lbl  = r.name.length > 17 ? r.name.slice(0,16) + '...' : r.name;
    /* Escape for SVG attribute */
    var esc  = r.id.replace(/'/g,"&apos;");

    /* Clickable room — cursor:pointer + hover fill change */
    html += '<g style="cursor:pointer" ';
    html += 'onmouseenter="setTip(\'' + (r.name + ' [' + r.id + '] — ' + STATUS_LABEL[r.status] + ' · Click to view photos').replace(/'/g,"\\'") + '\')" ';
    html += 'onmouseleave="setTip(\'\')" ';
    html += 'onclick="openLightbox(\'' + esc + '\')">';

    html += '<rect x="' + rx + '" y="' + ry + '" width="' + rw + '" height="' + rh + '" fill="' + fill + '" stroke="#c8b4b0" stroke-width="0.7" rx="2">';
    html += '<animate attributeName="stroke" values="#c8b4b0;' + accent + ';#c8b4b0" dur="1.5s" begin="mouseover" end="mouseout" repeatCount="indefinite"/>';
    html += '</rect>';

    /* Small camera icon top-left of each room */
    var camX = (+rx + 3).toFixed(1);
    var camY = (+ry + 3).toFixed(1);
    html += '<text x="' + camX + '" y="' + (+camY + 5).toFixed(1) + '" font-size="7" opacity="0.45">📷</text>';

    html += '<circle cx="' + dx + '" cy="' + dy + '" r="' + dr.toFixed(1) + '" fill="' + dc + '"/>';
    html += '<text x="' + cx + '" y="' + (+cy - fs*0.35).toFixed(1) + '" font-family="DM Sans,sans-serif" font-size="' + fs.toFixed(1) + '" font-weight="600" fill="#2c1a17" text-anchor="middle">' + r.id + '</text>';
    html += '<text x="' + cx + '" y="' + (+cy + fs*0.85).toFixed(1) + '" font-family="DM Sans,sans-serif" font-size="' + (fs*0.82).toFixed(1) + '" fill="#7a5a55" text-anchor="middle">' + lbl + '</text>';
    html += '</g>';
  }
  html += '<text x="6" y="218" font-family="DM Sans,sans-serif" font-size="7.5" fill="#b07a74">' + floor.label + '</text>';
  svg.innerHTML = html;
}

/* ── RENDER BLOCK ── */
function render(idx, anim) {
  if (anim === undefined) anim = true;
  curIdx   = idx;
  curFloor = 0;
  var b = BUILDINGS[idx];
  document.getElementById('blk-label').textContent = b.label;
  document.getElementById('i-name').textContent    = b.name;
  document.getElementById('i-desc').textContent    = b.desc;
  document.getElementById('i-hrs').textContent     = b.hours;
  var tagsEl = document.getElementById('i-tags');
  tagsEl.innerHTML = '';
  for (var i = 0; i < b.tags.length; i++) {
    var sp = document.createElement('span');
    sp.className   = 'tag';
    sp.textContent = b.tags[i];
    tagsEl.appendChild(sp);
  }
  var tabEl = document.getElementById('ftabs');
  if (b.floors.length > 1) {
    tabEl.style.display = 'flex';
    var tabHTML = '';
    for (var i = 0; i < b.floors.length; i++) {
      tabHTML += '<button class="ftab' + (i===0?' active':'') + '" id="ft'+i+'" onclick="switchFloor('+i+')">' + b.floors[i].label + '</button>';
    }
    tabEl.innerHTML = tabHTML;
  } else {
    tabEl.style.display = 'none';
  }
  var svg = document.getElementById('map-svg');
  if (anim) {
    svg.classList.add('fading');
    setTimeout(function() { drawFloor(b, 0); svg.classList.remove('fading'); }, 280);
  } else {
    drawFloor(b, 0);
  }
  setTip('Click a room to view photos · Hover to see details');
}

/* ── SWITCH FLOOR ── */
function switchFloor(fi) {
  curFloor = fi;
  var b = BUILDINGS[curIdx];
  for (var i = 0; i < b.floors.length; i++) {
    var t = document.getElementById('ft' + i);
    if (t) t.className = 'ftab' + (i === fi ? ' active' : '');
  }
  var svg = document.getElementById('map-svg');
  svg.classList.add('fading');
  setTimeout(function() { drawFloor(b, fi); svg.classList.remove('fading'); }, 250);
  setTip('Click a room to view photos · Hover to see details');
}

/* ── NAV ── */
function nextBlk() { render((curIdx + 1) % BUILDINGS.length); }
function prevBlk() { render((curIdx - 1 + BUILDINGS.length) % BUILDINGS.length); }

/* ── TOOLTIP ── */
function setTip(t) { document.getElementById('tip').textContent = t || 'Click a room to view photos · Hover to see details'; }

/* ── MODAL ── */
function openModal(key) {
  var m = MODALS[key];
  if (!m) return;
  document.getElementById('m-title').textContent = m.title;
  document.getElementById('m-body').innerHTML    = m.body;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

/* Escape closes modal too, but only if lightbox is not open */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) { closeLightbox(); }
    else { closeModal(); }
  }
});

/* ── TOAST ── */
var _tt;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(function() { t.classList.remove('show'); }, 2800);
}
