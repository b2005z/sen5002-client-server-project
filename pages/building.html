<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Map — Cardiff Met Navigator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: radial-gradient(ellipse at 50% 30%, #3a1a15, #1a0f0d);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 860px; background: #f9cdc8; border-radius: 14px;
    overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.45);
    animation: up .4s ease;
  }
  @keyframes up { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }

  /* HEADER */
  .hdr {
    background: #f9cdc8; border-bottom: 1.5px solid #f0a89f;
    padding: 12px 18px; display: flex; align-items: center; gap: 14px;
  }
  .logo { width: 68px; height: 68px; flex-shrink: 0; }
  .logo svg { width: 100%; height: 100%; }
  .hdr-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px; color: #c0392b; flex: 1;
  }
  .hdr-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .mode-box {
    background: #fff; border: 1.5px solid #d4a017; border-radius: 5px;
    padding: 5px 16px; font-size: 13px; font-weight: 600;
    color: #c0392b; min-width: 110px; text-align: center;
  }
  .hdr-btns { display: flex; gap: 8px; }
  .btn {
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; border-radius: 5px; transition: all .18s;
  }
  .btn-g { background: #f0c060; border: 1.5px solid #d4a017; color: #2c1a17; padding: 8px 18px; }
  .btn-g:hover { background: #d4a017; color: #fff; }
  .btn-so { background: #f0c060; border: 1.5px solid #d4a017; color: #2c1a17; padding: 7px 16px; }
  .btn-so:hover { background: #c0392b; color: #fff; }

  /* TOOLBAR */
  .toolbar {
    padding: 10px 18px; display: flex; align-items: center;
    justify-content: space-between; border-bottom: 1px solid #f0a89f;
  }
  .blk-label {
    background: #fff; border: 1.5px solid #c0392b; border-radius: 5px;
    padding: 7px 22px; font-size: 14px; font-weight: 600;
    color: #c0392b; min-width: 150px;
  }
  .arr-group { display: flex; }
  .arr {
    width: 44px; height: 40px; background: #7a8fa0; border: none;
    color: #fff; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .18s;
  }
  .arr:hover { background: #4e6878; }
  .arr:first-child { border-radius: 6px 0 0 6px; }
  .arr:last-child  { border-radius: 0 6px 6px 0; }

  /* MAP */
  .map-area { padding: 18px 24px; display: flex; justify-content: center; }
  .map-frame { width: 560px; background: #fff; border: 1.5px solid #aaa; border-radius: 6px; overflow: hidden; }
  .ftabs { display: flex; border-bottom: 1px solid #e8d8d5; background: #fde8e5; }
  .ftab {
    flex: 1; padding: 7px 4px; font-family: 'DM Sans', sans-serif;
    font-size: 11px; font-weight: 600; color: #7a5a55; border: none;
    background: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s;
  }
  .ftab.active { color: #c0392b; border-bottom-color: #c0392b; background: #fff; }
  .ftab:hover:not(.active) { color: #c0392b; }
  .map-svg { display: block; width: 100%; transition: opacity .3s; }
  .map-svg.fading { opacity: 0; }
  .tip-strip {
    text-align: center; font-size: 11px; color: #7a5a55;
    padding: 5px 10px; background: #fff8f6;
    border-top: 1px solid #f0e0dc; min-height: 24px;
  }

  /* LEGEND */
  .legend { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 24px 8px; }
  .leg { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #7a5a55; }
  .leg-sq { width: 9px; height: 9px; border-radius: 2px; }

  /* INFO STRIP */
  .info {
    margin: 0 24px 14px; background: #fff;
    border: 1.5px solid #f0a89f; border-radius: 6px;
    padding: 12px 16px; display: flex; gap: 18px; align-items: flex-start;
  }
  .info-main { flex: 1; }
  .info-name { font-family: 'Playfair Display', serif; font-size: 15px; color: #c0392b; margin-bottom: 5px; }
  .info-desc { font-size: 12px; color: #7a5a55; line-height: 1.6; }
  .info-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .tag {
    background: #fde8e5; border: 1px solid #f0a89f;
    border-radius: 20px; padding: 2px 9px;
    font-size: 10px; color: #922b21; font-weight: 500;
  }
  .info-hrs { font-size: 11px; color: #7a5a55; white-space: nowrap; }
  .info-hrs strong { color: #c0392b; display: block; font-size: 11px; margin-bottom: 2px; }

  /* FOOTER */
  .footer {
    border-top: 1.5px solid #f0a89f; padding: 10px 18px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .help-btn {
    font-size: 13px; font-weight: 600; color: #c0392b;
    cursor: pointer; text-decoration: underline;
    background: none; border: none; font-family: 'DM Sans', sans-serif;
  }
  .help-btn:hover { color: #922b21; }

  /* MODAL */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.5); z-index: 100;
    align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .mbox {
    background: #fff; border-radius: 14px; padding: 28px 32px;
    max-width: 400px; width: 90%; box-shadow: 0 16px 48px rgba(0,0,0,.3);
  }
  .mbox h2 { font-family: 'Playfair Display', serif; font-size: 19px; color: #c0392b; margin-bottom: 10px; }
  .mbox p { font-size: 13px; color: #7a5a55; line-height: 1.65; }
  .mclose {
    margin-top: 18px; padding: 8px 24px;
    background: #f0c060; border: 1.5px solid #d4a017;
    border-radius: 5px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }
  .mclose:hover { background: #d4a017; color: #fff; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #2c1a17; color: #fff; padding: 9px 22px;
    border-radius: 22px; font-size: 13px; font-weight: 500;
    transition: transform .3s; pointer-events: none; z-index: 200;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>

</div>

/* ── STATE ── */
var curIdx   = 0;

/* ── DRAW FLOOR PLAN ── */
function drawFloor(bldg, fi) {
  var floor = bldg.floors[fi];
  var rooms = floor.rooms;
  var svg   = document.getElementById('map-svg');
  var VW = 560, VH = 220;
  var rawW = 0, rawH = 0;
  for (var i = 0; i < rooms.length; i++) {
    rawW = Math.max(rawW, rooms[i].x + rooms[i].w);
    rawH = Math.max(rawH, rooms[i].y + rooms[i].h);
  }
  rawW += 14; rawH += 14;
  var scX = (VW - 6) / rawW;
  var scY = (VH - 6) / rawH;
  var sc  = Math.min(scX, scY);
  var oX  = (VW - rawW * sc) / 2;
  var oY  = (VH - rawH * sc) / 2;
  var accent = bldg.id==='E'?'#185FA5':bldg.id==='F'?'#534AB7':bldg.id==='H'?'#0F6E56':'#c0392b';

  var html = '<rect width="' + VW + '" height="' + VH + '" fill="#f8f4f2"/>';
  html += '<rect x="0" y="0" width="' + VW + '" height="18" fill="' + accent + '22"/>';
  html += '<text x="' + (VW/2) + '" y="12" font-family="Playfair Display,serif" font-size="8.5" font-weight="700" fill="' + accent + '" text-anchor="middle">' + bldg.name + ' — ' + floor.label + '</text>';

  var minRX = 9999, minRY = 9999;
  for (var i = 0; i < rooms.length; i++) { minRX = Math.min(minRX, rooms[i].x); minRY = Math.min(minRY, rooms[i].y); }
  var bx = (oX + minRX * sc).toFixed(1);
  var by = (oY + minRY * sc).toFixed(1);
  var bw = ((rawW - 14) * sc).toFixed(1);
  var bh = ((rawH - 14) * sc).toFixed(1);
  html += '<rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" fill="none" stroke="' + accent + '" stroke-width="1.2" rx="3"/>';

  for (var i = 0; i < rooms.length; i++) {
    var r  = rooms[i];
    var rx = (oX + r.x * sc).toFixed(1);
    var ry = (oY + r.y * sc).toFixed(1);
    var rw = (r.w * sc).toFixed(1);
    var rh = (r.h * sc).toFixed(1);
    var cx = (oX + (r.x + r.w / 2) * sc).toFixed(1);
    var cy = (oY + (r.y + r.h / 2) * sc).toFixed(1);
    var fill = TYPE_FILL[r.type] || '#f5f5f5';
    var dc   = STATUS_COLOR[r.status];
    var dr   = Math.max(3, Math.min(5, r.w * sc * 0.065));
    var dx   = (oX + (r.x + r.w) * sc - dr - 2).toFixed(1);
    var dy   = (oY + r.y * sc + dr + 2).toFixed(1);
    var fs   = Math.max(6.5, Math.min(9.5, r.w * sc * 0.13));
    var lbl  = r.name.length > 17 ? r.name.slice(0,16) + '...' : r.name;
    var tipTxt = r.name + ' [' + r.id + '] — ' + STATUS_LABEL[r.status];
    tipTxt = tipTxt.replace(/'/g, '&apos;').replace(/"/g, '&quot;');
    html += '<g style="cursor:pointer" onmouseenter="setTip(\'' + tipTxt.replace(/'/g,"\\'") + '\')" onmouseleave="setTip(\'\')">';
    html += '<rect x="' + rx + '" y="' + ry + '" width="' + rw + '" height="' + rh + '" fill="' + fill + '" stroke="#c8b4b0" stroke-width="0.7" rx="2"/>';
    html += '<circle cx="' + dx + '" cy="' + dy + '" r="' + dr.toFixed(1) + '" fill="' + dc + '"/>';
    html += '<text x="' + cx + '" y="' + (+cy - fs*0.35).toFixed(1) + '" font-family="DM Sans,sans-serif" font-size="' + fs.toFixed(1) + '" font-weight="600" fill="#2c1a17" text-anchor="middle">' + r.id + '</text>';
    html += '<text x="' + cx + '" y="' + (+cy + fs*0.85).toFixed(1) + '" font-family="DM Sans,sans-serif" font-size="' + (fs*0.82).toFixed(1) + '" fill="#7a5a55" text-anchor="middle">' + lbl + '</text>';
    html += '</g>';
  }
  html += '<text x="6" y="218" font-family="DM Sans,sans-serif" font-size="7.5" fill="#b07a74">' + floor.label + '</text>';
  svg.innerHTML = html;
}

/* ── RENDER BLOCK ── */
function render(idx, anim) {
  if (anim === undefined) anim = true;
  curIdx   = idx;
  curFloor = 0;
  var b = BUILDINGS[idx];
  document.getElementById('blk-label').textContent = b.label;
  document.getElementById('i-name').textContent    = b.name;
  document.getElementById('i-desc').textContent    = b.desc;
  document.getElementById('i-hrs').textContent     = b.hours;
  var tagsEl = document.getElementById('i-tags');
  tagsEl.innerHTML = '';
  for (var i = 0; i < b.tags.length; i++) {
    var sp = document.createElement('span');
    sp.className = 'tag';
    sp.textContent = b.tags[i];
    tagsEl.appendChild(sp);
  }
  var tabEl = document.getElementById('ftabs');
  if (b.floors.length > 1) {
    tabEl.style.display = 'flex';
    var tabHTML = '';
    for (var i = 0; i < b.floors.length; i++) {
      tabHTML += '<button class="ftab' + (i===0?' active':'') + '" id="ft'+i+'" onclick="switchFloor('+i+')">' + b.floors[i].label + '</button>';
    }
    tabEl.innerHTML = tabHTML;
  } else {
    tabEl.style.display = 'none';
  }
  var svg = document.getElementById('map-svg');
  if (anim) {
    svg.classList.add('fading');
    setTimeout(function() { drawFloor(b, 0); svg.classList.remove('fading'); }, 280);
  } else {
    drawFloor(b, 0);
  }
  setTip('Hover over a room to see details');
}

/* ── SWITCH FLOOR ── */
function switchFloor(fi) {
  curFloor = fi;
  var b = BUILDINGS[curIdx];
  for (var i = 0; i < b.floors.length; i++) {
    var t = document.getElementById('ft' + i);
    if (t) t.className = 'ftab' + (i === fi ? ' active' : '');
  }
  var svg = document.getElementById('map-svg');
  svg.classList.add('fading');
  setTimeout(function() { drawFloor(b, fi); svg.classList.remove('fading'); }, 250);
  setTip('Hover over a room to see details');
}

/* ── NAV ── */
function nextBlk() { render((curIdx + 1) % BUILDINGS.length); }
function prevBlk() { render((curIdx - 1 + BUILDINGS.length) % BUILDINGS.length); }

/* ── TOOLTIP ── */
function setTip(t) { document.getElementById('tip').textContent = t || 'Hover over a room to see details'; }

/* ── MODAL ── */
function openModal(key) {
  var m = MODALS[key];
  if (!m) return;
  document.getElementById('m-title').textContent = m.title;
  document.getElementById('m-body').innerHTML    = m.body;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

/* ── TOAST ── */
var _tt;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(function() { t.classList.remove('show'); }, 2800);
}

/* ── INIT ── */
window.addEventListener('DOMContentLoaded', function() {
  var mode = 'Guest';
  try { mode = sessionStorage.getItem('userMode') || 'Guest'; } catch(e) {}
  document.getElementById('mode-display').textContent = mode;
  var startIdx = 0;
  for (var i = 0; i < BUILDINGS.length; i++) { if (BUILDINGS[i].id === 'C') { startIdx = i; break; } }
  render(startIdx, false);
  showToast('Welcome! Signed in as ' + mode);
});
