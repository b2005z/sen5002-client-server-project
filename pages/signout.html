<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Out — Cardiff Met Navigator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: radial-gradient(ellipse at 50% 50%, #3a1a15, #1a0f0d);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #f9cdc8; border-radius: 22px;
    padding: 40px 48px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: up .4s ease;
    display: flex; flex-direction: column; align-items: center;
  }
  @keyframes up { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
  .logo-wrap { width: 72px; height: 72px; margin-bottom: 16px; }
  .logo-wrap svg { width: 100%; height: 100%; }
  h2 {
    font-family: 'Playfair Display', serif;
    font-size: 22px; color: #c0392b; margin-bottom: 8px;
  }
  p { font-size: 14px; color: #7a5a55; line-height: 1.6; margin-bottom: 28px; }
  .btn-row { display: flex; gap: 12px; justify-content: center; }
  .btn {
    padding: 10px 28px; border-radius: 6px;
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: all .18s;
  }
  .btn-cancel { background: #f0c060; border: 1.5px solid #d4a017; color: #2c1a17; }
  .btn-cancel:hover { background: #d4a017; color: #fff; }
  .btn-signout { background: #f0c060; border: 1.5px solid #d4a017; color: #2c1a17; }
  .btn-signout:hover { background: #c0392b; color: #fff; }
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: #2c1a17; color: #fff;
    padding: 9px 22px; border-radius: 22px;
    font-size: 13px; font-weight: 500;
    transition: transform .3s; pointer-events: none; z-index: 200;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110">
      <path d="M55,8 C35,8 19,24 19,44 C19,68 55,102 55,102 C55,102 91,68 91,44 C91,24 75,8 55,8 Z" fill="#c0392b"/>
      <circle cx="55" cy="43" r="24" fill="#fff"/>
      <polygon points="55,22 58.5,36 51.5,36" fill="#c0392b"/>
      <polygon points="55,64 58.5,50 51.5,50" fill="#c0392b" opacity=".35"/>
      <polygon points="76,43 62,39.5 62,46.5" fill="#f0c060"/>
      <polygon points="34,43 48,39.5 48,46.5" fill="#f0c060" opacity=".6"/>
      <circle cx="55" cy="43" r="18" fill="none" stroke="#c0392b" stroke-width=".7" stroke-dasharray="2 5" opacity=".5"/>
      <circle cx="55" cy="43" r="5.5" fill="#c0392b"/>
      <circle cx="55" cy="43" r="2.5" fill="#fff"/>
      <ellipse cx="55" cy="105" rx="14" ry="4" fill="#2c1a17" opacity=".12"/>
    </svg>
  </div>

  <h2>Sign out?</h2>
  <p>Are you sure you want to sign out of<br>the Cardiff Met Navigation App?</p>

  <div class="btn-row">
    <button class="btn btn-cancel"  onclick="window.location.href='building.html'">Cancel</button>
    <button class="btn btn-signout" onclick="doSignOut()">Sign Out</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  function doSignOut() {
    sessionStorage.removeItem('userMode');
    var t = document.getElementById('toast');
    t.textContent = 'Signed out successfully';
    t.classList.add('show');
    setTimeout(function() {
      window.location.href = 'welcome.html';
    }, 1000);
  }
</script>
</body>
</html>
